[workspace]
resolver = "2"
members = ["crates/sora-core", "crates/sora-driver"]
default-members = ["crates/sora-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["SoraCard"]
publish = false

# One WDK configuration per workspace (windows-drivers-rs requirement).
# Target KMDF 1.31: this is what Windows 10 (19045) ships. KMDF drivers are
# forward-compatible, so a 1.31 driver also runs on Windows 11 (KMDF 1.33).
[workspace.metadata.wdk.driver-model]
driver-type = "KMDF"
kmdf-version-major = 1
target-kmdf-version-minor = 31

[workspace.dependencies]
wdk = "0.4.1"
wdk-alloc = "0.4.1"
wdk-panic = "0.4.1"
wdk-sys = "0.5.1"
wdk-build = "0.5.1"
anyhow = "1.0.89"
paste = "1.0.14"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = 3
