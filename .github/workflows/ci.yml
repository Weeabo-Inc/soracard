name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pure protocol/policy logic: fast, and it runs everywhere.
  core:
    name: sora-core (host tests, lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo test -p sora-core
      - run: cargo fmt --all --check
      - run: cargo fmt --check --manifest-path storport/Cargo.toml
      - run: cargo clippy -p sora-core --all-targets -- -D warnings

  # The kernel driver (StorPort miniport, its own WDM workspace in storport/):
  # built exactly like on the test machine, with tools/build_storport.ps1 and
  # the same NuGet WDK/SDK versions.
  driver:
    name: soracard (StorPort build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install LLVM 17.0.6 (libclang for bindgen)
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "17.0.6"
          directory: C:\llvm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install WDK 10.0.26100.6584 and SDK 10.0.26100.1 (NuGet)
        shell: pwsh
        run: |
          foreach ($p in @(
              @('Microsoft.Windows.SDK.CPP', '10.0.26100.1'),
              @('Microsoft.Windows.SDK.CPP.x64', '10.0.26100.1'),
              @('Microsoft.Windows.WDK.x64', '10.0.26100.6584'))) {
            nuget install $p[0] -Version $p[1] -OutputDirectory C:\packages -NonInteractive
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }

      - name: Install cargo-wdk
        run: cargo install cargo-wdk --locked

      - name: Lint the driver crate
        shell: pwsh
        env:
          LIBCLANG_PATH: C:\llvm\bin
        run: tools/build_storport.ps1 -Clippy

      - name: Build and package the driver (release)
        shell: pwsh
        env:
          LIBCLANG_PATH: C:\llvm\bin
        run: tools/build_storport.ps1 -Package -Release
